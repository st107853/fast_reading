<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <link rel="stylesheet" type="text/css" href="/static/main_page.css">
    <script src="/static/main_page.js"></script>
    <script src="/static/script.js" defer></script>
    <script src="/static/labels.js" defer></script>
</head>
<body>
    <div class="fr-container" data-filter-code="1">

        {{template "navbar" .}}
        {{template "settingsModal" .}}

        <main>
            <form id="bookForm" onsubmit="event.preventDefault(); applyFilters();">
                <div class="mp-search-container">
                    <input name="name" id="keyword-input" type="text" class="mp-search-input" placeholder="Enter the title of the book..." aria-label="Enter the title of the book" maxlength="100">
                    <span class="mp-search-icon"></span>
                </div>
            </form>

            <div class="mp-controls-row">

                <div class="mp-controls-left">
                    <a href="/library/" class="fr-btn fr-btn--large">All books</a>
                    <button href="/library/continue/" class="fr-btn--large fr-btn--chosed">Continue reading</button>
                </div>

                <div class="mp-controls-right">
                    <button class="fr-btn--large mp-filter-btn" 
                            id="filterToggleBtn"
                            onclick="toggleFilters()"
                            aria-expanded="false"
                            aria-controls="labels-container">
                        Filters
                    </button>

                    <button onclick="applyFilters()" 
                            class="fr-btn--large mp-apply-btn" 
                            id="applyBtn">Apply</button>

                </div>

            </div>

            <div class="fr-list mp-labels-container" 
                id="labels-container" 
                aria-hidden="true">
                {{range .Labels}}
                    <div class="fr-label fr-label--interactive" 
                        data-id="{{.LabelID}}" 
                        tabindex="0">{{.Name}}</div>
                {{end}}
            </div>

            <hr>

            <div id="results-container" class="fr-card-list" id="cardList">
                {{range .Books}}
                    {{template "bookCard" .}}
                {{end}}
            </div>
        </main>
    </div>
</body>
</html>
